name: C/C++ CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++
      - name: Build script
        run: ./cicd/build.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries
          path: usr/bin/
  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests
        run: ./cicd/test.sh
  package:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
      - name: Install packaging tools
        run: sudo apt-get install -y dpkg-dev
      - name: Create .deb package
        run: ./cicd/package.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: programm_1,0_all.deb
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
 
      - name: Build Docker image from .deb
        run: |
          set -euo pipefail
          ls -la dist
          docker build -t reverse:ci .
 
      - name: Run container and validate output
        run: |
          set -euo pipefail
          docker run --rm reverse:ci | tee container.out
          grep -Eq '^Zeros above main diagonal: [0-9]+$' container.out
          grep -Eq '^Positive below secondary diagonal: [0-9]+$' container.out
 
      - name: Publish image to Docker Hub (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_TAG: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set. Skipping Docker Hub push."
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker tag reverse:ci "${IMAGE_NAME}:${VERSION_TAG}"
          docker tag reverse:ci "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${VERSION_TAG}"
          docker push "${IMAGE_NAME}:latest"
